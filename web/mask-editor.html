                yesBtn.textContent = "知道了";
                yesBtn.classList.remove("btn-confirm");
                yesBtn.classList.add("btn-cancel");
                yesBtn.onclick = function () {
                  overlay.remove();
                };
              }
              if (noBtn) noBtn.style.display = "none";
            }
            return;
          }

          try {
            const t0 = performance.now();
            const output = generateOutputImages();
            const t1 = performance.now();

            const hasMask = (function () {
              if (!maskData) return false;
              const d = maskData.data;
              for (let i = 0; i < d.length; i += 4) {
                if (d[i] > 10) return true;
              }
              return false;
            })();

            const hasDoodle = (function () {
              if (!doodleLayerData) return false;
              const d = doodleLayerData.data;
              for (let i = 3; i < d.length; i += 4) {
                if (d[i] > 0) return true;
              }
              return false;
            })();

            const editorSessionId =
              SNAPSHOT_PREFIX +
              Date.now() +
              "_" +
              Math.random().toString(36).substr(2, 6);

            const snapshot = {
              editData: editImageData.data.buffer.slice(0),
              originalData: originalPreviewData
                ? originalPreviewData.data.buffer.slice(0)
                : null,
              originalWidth: originalPreviewData
                ? originalPreviewData.width
                : editWidth,
              originalHeight: originalPreviewData
                ? originalPreviewData.height
                : editHeight,
              maskData: maskData ? maskData.data.buffer.slice(0) : null,
              doodleData: doodleLayerData
                ? doodleLayerData.data.buffer.slice(0)
                : null,
              colorParams: { ...colorParams },
              width: editWidth,
              height: editHeight,
              resizeRatio: resizeEnabled ? resizeRatioValue : 1.0,
              doodleAlphaEnabled: doodleAlphaEnabled,
              createdAt: Date.now(),
            };

            const payload = {
              image: output.mainImageUrl,
              previewImage: output.previewImageUrl,
              maskImage: output.maskOnlyUrl,
              maskAlphaImage: output.maskAlphaImageUrl,
              width: output.width,
              height: output.height,
              hasMask: hasMask,
              hasDoodle: hasDoodle,
              editorSessionId: editorSessionId,
              version: "1.0",
              mode: "webgl-expand-magnet-overlay-snapshot-autocolor-levels-output-texture-gpu-export-resize-doodlealpha-eyedropper",
            };

            const params = new URLSearchParams(window.location.search);
            const nodeId = params.get("nodeId") || "";
            const snapshotKey = nodeId
              ? "bb_snapshot_" + nodeId
              : editorSessionId;

            Promise.all([
              DB.put("mask_editor_result", JSON.stringify(payload)),
              DB.put(editorSessionId, snapshot),
              DB.put(snapshotKey, snapshot),
            ])
              .then(() => {
                if (window.opener) {
                  try {
                    window.opener.postMessage(
                      {
                        type: "mask_saved",
                        payload: payload,
                      },
                      "*",
                    );
                  } catch (e) {}
                }
                showToast("✅ 保存成功");
                setTimeout(() => window.close(), 500);
              })
              .catch((err) => {
                console.error("❌ 存储失败:", err);
                alert("保存失败: " + err.message);
              });
          } catch (e) {
            console.error("❌ 保存失败:", e);
            showToast("❌ " + e.message);
          }
        };

        async function initFromURL(url) {
  try {
    const resp = await fetch(url);
    const blob = await resp.blob();
    const bitmap = await createImageBitmap(blob);
    const w = bitmap.width, h = bitmap.height;
    console.log("bitmap:", w, h);

    const out = new ImageData(w, h);
    const tile = 1024; // 更小的 tile，避免单块 canvas 触发限制

    for (let y = 0; y < h; y += tile) {
      for (let x = 0; x < w; x += tile) {
        const tw = Math.min(tile, w - x);
        const th = Math.min(tile, h - y);

        // 每块用独立的小 canvas 绘制
        const c = document.createElement("canvas");
        c.width = tw;
        c.height = th;
        const cx = c.getContext("2d", { willReadFrequently: true });
        cx.drawImage(bitmap, x, y, tw, th, 0, 0, tw, th);

        const part = cx.getImageData(0, 0, tw, th);
        for (let ty = 0; ty < th; ty++) {
          const srcRow = ty * tw * 4;
          const dstRow = ((y + ty) * w + x) * 4;
          out.data.set(part.data.subarray(srcRow, srcRow + tw * 4), dstRow);
        }
      }
    }


    bitmap.close();
    initFromImageData(out, w, h);
  } catch (e) {
    console.error("图片加载失败:", e);
    showToast("⚠️ 图片加载失败: " + e.message);
  }
}



        function initFromImageData(imgData, w, h) {
          editWidth = w;
          editHeight = h;

          originalImageData = new ImageData(
            new Uint8ClampedArray(imgData.data),
            w,
            h,
          );
          editImageData = new ImageData(
            new Uint8ClampedArray(imgData.data),
            w,
            h,
          );
          originalPreviewData = new ImageData(
            new Uint8ClampedArray(imgData.data),
            w,
            h,
          );
          maskData = new ImageData(w, h);
          for (let i = 0; i < maskData.data.length; i++) maskData.data[i] = 0;

          doodleLayerData = new ImageData(w, h);
          for (let i = 0; i < doodleLayerData.data.length; i += 4) {
            doodleLayerData.data[i] = 0;
            doodleLayerData.data[i + 1] = 0;
            doodleLayerData.data[i + 2] = 0;
            doodleLayerData.data[i + 3] = 0;
          }

          Object.keys(colorParams).forEach((k) => {
            if (k === "levelsWhite" || k === "levelsOutputWhite")
              colorParams[k] = 255;
            else if (k === "levelsGamma") colorParams[k] = 1.0;
            else colorParams[k] = 0;
          });
          updateSliderUI();

          doodleAlphaEnabled = false;
          const dab = document.getElementById("doodleAlphaBtn");
          if (dab) dab.classList.remove("active-alpha");

          autoColorStats = computeAutoColorStats(editImageData);

          isCropModeActive = false;
          cropBtn.classList.remove("active-crop");
          cropSelection = null;

          resizeEnabled = false;
          resizeEditedAfter = false;
          resizeRatioValue = 1.0;
          resizeRatioInput.value = "1.00";
          updateResizeUI();

          if (!initWebGL()) {
            alert("WebGL 初始化失败");
            return;
          }

          rebuildTextures();
          isInitialized = true;
          recalculateDisplaySize();

          resizeCursorCanvas();

          resetHistory();

          updateUI();
const safeMax0 = probeCanvasMax();
          const initScale = Math.min(1, safeMax0 / Math.max(w, h));
          window.__canvasRenderW = Math.max(1, Math.round(w * initScale));
          window.__canvasRenderH = Math.max(1, Math.round(h * initScale));
          fitToScreen();
          updateHistoryButtons();
          showToast(`✅ 图片已加载: ${w}×${h}`);
        }

        window.addEventListener("message", function (e) {
          const data = e.data;
          if (!data) return;
          if (data.type === "load_image_bitmap" && data.bitmap) {
            const w = data.bitmap.width,
              h = data.bitmap.height;
            const canvas = document.createElement("canvas");
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(data.bitmap, 0, 0);
            const imgData = ctx.getImageData(0, 0, w, h);
            initFromImageData(imgData, w, h);
            return;
          }
          if (data.type === "load_image" && data.imageUrl) {
            initFromURL(data.imageUrl);
            return;
          }
        });

        function restoreFromSnapshot(snapshot) {
          if (!snapshot || !snapshot.editData) {
            showToast("⚠️ 快照数据损坏");
            return;
          }

          isRestoring = true;

          editWidth = snapshot.width;
          editHeight = snapshot.height;

          editImageData = new ImageData(
            new Uint8ClampedArray(snapshot.editData),
            editWidth,
            editHeight,
          );
          originalPreviewData = snapshot.originalData
            ? new ImageData(
                new Uint8ClampedArray(snapshot.originalData),
                snapshot.originalWidth || editWidth,
                snapshot.originalHeight || editHeight,
              )
            : new ImageData(
                new Uint8ClampedArray(snapshot.editData),
                editWidth,
                editHeight,
              );
          originalImageData = new ImageData(
            new Uint8ClampedArray(snapshot.editData),
            editWidth,
            editHeight,
          );

          if (snapshot.maskData) {
            maskData = new ImageData(
              new Uint8ClampedArray(snapshot.maskData),
              editWidth,
              editHeight,
            );
          } else {
            maskData = new ImageData(editWidth, editHeight);
            for (let i = 0; i < maskData.data.length; i++) maskData.data[i] = 0;
          }

          if (snapshot.doodleData) {
            doodleLayerData = new ImageData(
              new Uint8ClampedArray(snapshot.doodleData),
              editWidth,
              editHeight,
            );
          } else {
            doodleLayerData = new ImageData(editWidth, editHeight);
            for (let i = 0; i < doodleLayerData.data.length; i += 4) {
              doodleLayerData.data[i] = 0;
              doodleLayerData.data[i + 1] = 0;
              doodleLayerData.data[i + 2] = 0;
              doodleLayerData.data[i + 3] = 0;
            }
          }

          if (snapshot.colorParams) {
            Object.assign(colorParams, snapshot.colorParams);
            if (colorParams.texture === undefined) colorParams.texture = 0;
            if (colorParams.autoContrast === undefined)
              colorParams.autoContrast = 0;
            if (colorParams.autoColor === undefined) colorParams.autoColor = 0;
            if (colorParams.levelsBlack === undefined)
              colorParams.levelsBlack = 0;
            if (colorParams.levelsWhite === undefined)
              colorParams.levelsWhite = 255;
            if (colorParams.levelsGamma === undefined)
              colorParams.levelsGamma = 1.0;
            if (colorParams.levelsOutputBlack === undefined)
              colorParams.levelsOutputBlack = 0;
            if (colorParams.levelsOutputWhite === undefined)
              colorParams.levelsOutputWhite = 255;

            updateSliderUI();
          }

          doodleAlphaEnabled = !!snapshot.doodleAlphaEnabled;
          const dab = document.getElementById("doodleAlphaBtn");
          if (dab) dab.classList.toggle("active-alpha", doodleAlphaEnabled);

          resizeEnabled = false;
          resizeEditedAfter = false;
          resizeRatioValue = 1.0;
          resizeRatioInput.value = "1.00";
          updateResizeUI();

          isCropModeActive = false;
          if (cropBtn) cropBtn.classList.remove("active-crop");
          cropSelection = null;

          if (!initWebGL()) {
            alert("WebGL 初始化失败");
            isRestoring = false;
            return;
          }

          rebuildTextures();
          autoColorStats = computeAutoColorStats(editImageData);
          isInitialized = true;
          recalculateDisplaySize();
          resizeCursorCanvas();

          isRestoring = false; // 允许 createSnapshot 正常读数据

          const originalSnapshot = {
            editData: snapshot.originalData || snapshot.editData,
            maskData: null,
            doodleData: null,
            width: snapshot.originalWidth || snapshot.width,
            height: snapshot.originalHeight || snapshot.height,
            colorParams: {
              texture: 0,
              saturation: 0,
              brightness: 0,
              contrast: 0,
              red: 0,
              green: 0,
              blue: 0,
              autoContrast: 0,
              autoColor: 0,
              levelsBlack: 0,
              levelsWhite: 255,
              levelsGamma: 1.0,
              levelsOutputBlack: 0,
              levelsOutputWhite: 255,
            },
            doodleAlphaEnabled: false,
          };

          const appliedSnapshot = createSnapshot();

          history = [originalSnapshot, appliedSnapshot];
          historyIndex = 1;
          updateUndoCount();
          updateHistoryButtons();

          updateUI();
const safeMax0 = probeCanvasMax();
          const initScale = Math.min(1, safeMax0 / Math.max(editWidth, editHeight));
          window.__canvasRenderW = Math.max(1, Math.round(editWidth * initScale));
          window.__canvasRenderH = Math.max(1, Math.round(editHeight * initScale));
          fitToScreen();
          showToast(`✅ 已恢复到上次应用状态: ${editWidth}×${editHeight}`);
        }

        function loadImage() {
          const params = new URLSearchParams(window.location.search);

          const snapshotId = params.get("snapshotId");
          if (snapshotId) {
            DB.get(snapshotId)
              .then((snapshot) => {
                if (snapshot) {
                  restoreFromSnapshot(snapshot);
                } else {
                  showToast("⚠️ 未找到快照");
                  console.warn("快照不存在:", snapshotId);
                }
              })
              .catch((err) => {
                console.error("读取快照失败:", err);
                showToast("⚠️ 快照读取失败");
              });
            return;
          }

          const imageId = params.get("imageId");
          if (imageId) {
            DB.get(imageId)
              .then((dataUrl) => {
                if (dataUrl) {
                  initFromURL(dataUrl);
                  DB.delete(imageId).catch(() => {});
                } else {
                  showToast("⚠️ 未找到图片");
                }
              })
              .catch(() => {});
            return;
          }

          const stored = localStorage.getItem("mask_editor_image");
          if (stored) {
            localStorage.removeItem("mask_editor_image");
            initFromURL(stored);
            return;
          }

          if (window.opener) {
            window.opener.postMessage({ type: "request_image" }, "*");
          }
          setTimeout(() => {
            if (!isInitialized) {
              showToast("📷 等待图片...");
            }
          }, 2000);
        }

        function activateEyedropper() {
          if (
            currentTool === "doodle" ||
            currentTool === "doodleRect" ||
            currentTool === "doodleCircle" ||
            currentTool === "doodleFill" ||
            currentTool === "doodleEraser"
          ) {
            if (!isEyedropperActive) {
              isEyedropperActive = true;
              lastPickedColor = doodleColorPicker.value;
              if (lastMouseClientX !== null && lastMouseClientY !== null) {
                drawAllOverlay(lastMouseClientX, lastMouseClientY);
              } else {
                const rect = wrapper.getBoundingClientRect();
                drawAllOverlay(
                  rect.left + rect.width / 2,
                  rect.top + rect.height / 2,
                );
              }
              showToast("🎨 吸管取色: 单击图像任意位置取色");
            }
          }
        }

        function deactivateEyedropper() {
          if (isEyedropperActive) {
            isEyedropperActive = false;
            lastPickedColor = null;
            if (lastMouseClientX !== null && lastMouseClientY !== null) {
              drawAllOverlay(lastMouseClientX, lastMouseClientY);
            } else {
              const rect = wrapper.getBoundingClientRect();
              drawAllOverlay(
                rect.left + rect.width / 2,
                rect.top + rect.height / 2,
              );
            }
            showToast("🎨 取色已关闭");
          }
        }

        document.addEventListener("keydown", function (e) {
          if (e.key === "Alt") {
            e.preventDefault();
            isAltDown = true;
            activateEyedropper();
          }
        });

        document.addEventListener("keyup", function (e) {
          if (e.key === "Alt") {
            e.preventDefault();
            isAltDown = false;
            deactivateEyedropper();
          }
        });

        window.addEventListener(
          "keydown",
          function (e) {
            if (e.key === "Alt") {
              e.preventDefault();
            }
          },
          true,
        );

        document.addEventListener("keydown", function (e) {
          if ((e.ctrlKey || e.metaKey) && e.key === "z" && !e.shiftKey) {
            e.preventDefault();
            undo();
            return;
          }
          if (
            (e.ctrlKey || e.metaKey) &&
            (e.key === "y" || (e.key === "z" && e.shiftKey))
          ) {
            e.preventDefault();
            redo();
            return;
          }

          if (e.key === " " || e.key === "space" || e.code === "Space") {
  e.preventDefault();

  recalculateDisplaySize();
  // 用 canvas 实际渲染尺寸做基准，和 fitToScreen 保持一致
  const baseW = window.__canvasRenderW || editWidth;
  const baseH = window.__canvasRenderH || editHeight;
  const fitScale = Math.min(
    cachedDisplayWidth / baseW,
    cachedDisplayHeight / baseH,
  );
  const fitZoom = Math.max(0.05, Math.min(5, fitScale));

  const isFitted = Math.abs(zoom - fitZoom) < 0.01;

            if (isFitted) {
              resetView();
              showToast("↺ 100% 像素");
            } else {
              fitToScreen();
              showToast("🖼️ 自适应窗口");
            }
            return;
          }

          if (e.key === "Escape") {
            if (isExpandSelecting) {
              isExpandSelecting = false;
              expandSelection = null;
              if (expandModeBadge) expandModeBadge.classList.remove("active");
              drawSelectionOverlay();
              showToast("🖼️ 已取消扩图");
              e.preventDefault();
              return;
            }
            if (isCropModeActive) {
              isCropModeActive = false;
              cropBtn.classList.remove("active-crop");
              cropSelection = null;
              drawSelectionOverlay();
              showToast("✂️ 已退出裁切模式");
              e.preventDefault();
              return;
            }
            selection = null;
            doodleSelection = null;
            drawSelectionOverlay();
            e.preventDefault();
            return;
          }

          const key = e.key.toLowerCase();

          if (
            ["b", "e", "r", "c", "f", "d", "x"].includes(key) ||
            (e.shiftKey && ["r", "c", "f"].includes(key))
          ) {
            if (isCropModeActive) {
              isCropModeActive = false;
              cropBtn.classList.remove("active-crop");
              cropSelection = null;
              drawSelectionOverlay();
              showToast("✂️ 已退出裁切模式");
            }
          }

          if (key === "b") {
            switchTool("brush");
            e.preventDefault();
          }
          if (key === "e") {
            switchTool("eraser");
            e.preventDefault();
          }
          if (key === "r") {
            switchTool("rect");
            e.preventDefault();
          }
          if (key === "c") {
            switchTool("circle");
            e.preventDefault();
          }
          if (key === "f") {
            switchTool("fill");
            e.preventDefault();
          }
          if (key === "d") {
            switchTool("doodle");
            e.preventDefault();
          }
          if (key === "x") {
            switchTool("doodleEraser");
            e.preventDefault();
          }
          if (e.shiftKey && key === "r") {
            switchTool("doodleRect");
            e.preventDefault();
          }
          if (e.shiftKey && key === "c") {
            switchTool("doodleCircle");
            e.preventDefault();
          }
          if (e.shiftKey && key === "f") {
            switchTool("doodleFill");
            e.preventDefault();
          }
        });

        wrapper.addEventListener("mousedown", onMouseDown);
        document.addEventListener("mousemove", onMouseMove);
        document.addEventListener("mouseup", onMouseUp);
        wrapper.addEventListener("mouseleave", onMouseLeave);
        wrapper.addEventListener("mouseenter", function (e) {
          drawAllOverlay(e.clientX, e.clientY);
        });

        wrapper.addEventListener("mousedown", onPanStart);
        document.addEventListener("mousemove", onPanMove);
        document.addEventListener("mouseup", onPanEnd);
        wrapper.addEventListener("contextmenu", function (e) {
          e.preventDefault();
        });

                wrapper.addEventListener(
          "wheel",
          function (e) {
            e.preventDefault();
            const oldZoom = zoom;

            const zoomFactor = e.deltaY > 0 ? 1 / 1.15 : 1.15;
            let newZoom = oldZoom * zoomFactor;
            newZoom = Math.max(0.1, Math.min(5, newZoom));

            if (Math.abs(newZoom - oldZoom) < 1e-6) return;

            // 以"画布当前实际中心"为锚点，单图/对比图通用
            // 反推未平移时的中心（屏幕坐标）= 当前中心 - pan
            const elRect = canvasContainer.getBoundingClientRect();
            const cxScreen = (elRect.left + elRect.width / 2) - panX;
            const cyScreen = (elRect.top + elRect.height / 2) - panY;

            const dx = e.clientX - cxScreen;
            const dy = e.clientY - cyScreen;

            const ratio = newZoom / oldZoom;
            panX = panX * ratio + dx * (1 - ratio);
            panY = panY * ratio + dy * (1 - ratio);

            zoom = newZoom;
            applyZoom();
            renderGL(true);
          },
          { passive: false },
        );

        window.addEventListener("resize", function () {
          resizeCursorCanvas();
          recalculateDisplaySize();
          renderGL();
        });

        document.addEventListener("fullscreenchange", function () {
          setTimeout(() => {
            resizeCursorCanvas();
            recalculateDisplaySize();
            renderGL();
          }, 200);
        });
        document.addEventListener("webkitfullscreenchange", function () {
          setTimeout(() => {
            resizeCursorCanvas();
            recalculateDisplaySize();
            renderGL();
          }, 200);
        });

        document.addEventListener("DOMContentLoaded", function () {
          const undoBtn = document.getElementById("bbUndoBtn");
          const redoBtn = document.getElementById("bbRedoBtn");
          if (undoBtn)
            undoBtn.addEventListener("click", function () {
              undo();
            });
          if (redoBtn)
            redoBtn.addEventListener("click", function () {
              redo();
            });
          switchTool("brush");
          loadImage();
          resizeCursorCanvas();
          updateLevelsUI();
          updateResizeUI();

          document.addEventListener("dragover", function (e) {
            e.preventDefault();
          });
          document.addEventListener("drop", function (e) {
            e.preventDefault();
            const files = Array.from(e.dataTransfer.files).filter((f) =>
              f.type.startsWith("image/"),
            );
            if (files.length > 0) {
              const reader = new FileReader();
              reader.onload = function (ev) {
                initFromURL(ev.target.result);
              };
              reader.readAsDataURL(files[0]);
            }
          });

          setTimeout(() => {
            if (!isInitialized && window.opener) {
              window.opener.postMessage({ type: "request_image" }, "*");
            }
          }, 3000);
        });
      })();
    </script>
  </body>
</html>
