        function clearCursor() {
          if (cursorCtx)
            cursorCtx.clearRect(0, 0, cursorCanvas.width, cursorCanvas.height);
        }

        function drawStrokeCPU(x1, y1, x2, y2, layer) {
          const source = layer === "mask" ? maskData : doodleLayerData;
          if (!source) return;
          const w = editWidth,
            h = editHeight;
          const size = parseInt(brushSizeInput.value);
          const isEraser =
            (layer === "mask" && currentTool === "eraser") ||
            (layer === "doodle" && currentTool === "doodleEraser");

          const radius = size / 2 + 2;
          let minX = Math.floor(Math.min(x1, x2) - radius);
          let maxX = Math.ceil(Math.max(x1, x2) + radius);
          let minY = Math.floor(Math.min(y1, y2) - radius);
          let maxY = Math.ceil(Math.max(y1, y2) + radius);

          minX = Math.max(0, minX);
          minY = Math.max(0, minY);
          maxX = Math.min(w, maxX);
          maxY = Math.min(h, maxY);

          const boxW = maxX - minX;
          const boxH = maxY - minY;
          if (boxW <= 0 || boxH <= 0) return;

          const { canvas, ctx } = getTempCanvas();
          canvas.width = boxW;
          canvas.height = boxH;

          const srcData = source.data;
          const subImage = ctx.createImageData(boxW, boxH);
          const sub = subImage.data;

          for (let dy = 0; dy < boxH; dy++) {
            const srcRow = ((minY + dy) * w + minX) * 4;
            const dstRow = dy * boxW * 4;
            for (let dx = 0; dx < boxW; dx++) {
              const si = srcRow + dx * 4;
              const di = dstRow + dx * 4;
              sub[di] = srcData[si];
              sub[di + 1] = srcData[si + 1];
              sub[di + 2] = srcData[si + 2];
              sub[di + 3] = srcData[si + 3];
            }
          }
          ctx.putImageData(subImage, 0, 0);

          const localX1 = x1 - minX;
          const localY1 = y1 - minY;
          const localX2 = x2 - minX;
          const localY2 = y2 - minY;

          if (layer === "doodle") {
            ctx.globalCompositeOperation = isEraser
              ? "destination-out"
              : "source-over";
            ctx.strokeStyle = isEraser ? "#ffffff" : doodleColor;
          } else {
            ctx.globalCompositeOperation = isEraser
              ? "destination-out"
              : "source-over";
            ctx.strokeStyle = "#ffffff";
          }
          ctx.globalAlpha = 1.0;
          ctx.lineWidth = size;
          ctx.lineCap = "round";
          ctx.lineJoin = "round";
          ctx.beginPath();
          ctx.moveTo(localX1, localY1);
          ctx.lineTo(localX2, localY2);
          ctx.stroke();

          const imageData = ctx.getImageData(0, 0, boxW, boxH);
          const data = imageData.data;
          const threshold = 128;
          const isDoodle = layer === "doodle";

          for (let i = 0; i < data.length; i += 4) {
            if (isDoodle && !isEraser) {
              if (data[i + 3] > 0 && data[i + 3] < threshold) {
                data[i + 3] = 255;
              }
            } else if (layer === "mask" && !isEraser) {
              if (data[i] > 0 && data[i] < threshold) {
                data[i] = 255;
                data[i + 1] = 255;
                data[i + 2] = 255;
                data[i + 3] = 255;
              }
            }
          }

          const result = data;
          for (let dy = 0; dy < boxH; dy++) {
            const srcRow = ((minY + dy) * w + minX) * 4;
            const dstRow = dy * boxW * 4;
            for (let dx = 0; dx < boxW; dx++) {
              const si = srcRow + dx * 4;
              const di = dstRow + dx * 4;
              srcData[si] = result[di];
              srcData[si + 1] = result[di + 1];
              srcData[si + 2] = result[di + 2];
              srcData[si + 3] = result[di + 3];
            }
          }

          if (isCropModeActive) {
            isCropModeActive = false;
            cropBtn.classList.remove("active-crop");
            cropSelection = null;
            drawSelectionOverlay();
          }

          markEditedAfterResize();

          updateTexturesAndRender({
            x: minX,
            y: minY,
            w: boxW,
            h: boxH,
            layer: layer,
          });
        }

        function updateTexturesAndRender(dirtyRect) {
          if (!isInitialized) return;
          const w = editWidth,
            h = editHeight;

          if (dirtyRect && dirtyRect.w > 0 && dirtyRect.h > 0) {
            const { x, y, w: dw, h: dh, layer } = dirtyRect;

            if (layer === "mask") {
              const region = maskToRGBARegion(maskData, x, y, dw, dh);
              gl.bindTexture(gl.TEXTURE_2D, texMask);
              gl.texSubImage2D(
                gl.TEXTURE_2D,
                0,
                x,
                y,
                dw,
                dh,
                gl.RGBA,
                gl.UNSIGNED_BYTE,
                region,
              );
            } else if (layer === "doodle") {
              const region = new Uint8Array(dw * dh * 4);
              const src = doodleLayerData.data;
              for (let dy = 0; dy < dh; dy++) {
                const srcRow = ((y + dy) * w + x) * 4;
                const dstRow = dy * dw * 4;
                for (let dx = 0; dx < dw; dx++) {
                  const si = srcRow + dx * 4;
                  const di = dstRow + dx * 4;
                  region[di] = src[si];
                  region[di + 1] = src[si + 1];
                  region[di + 2] = src[si + 2];
                  region[di + 3] = src[si + 3];
                }
              }
              gl.bindTexture(gl.TEXTURE_2D, texDoodle);
              gl.texSubImage2D(
                gl.TEXTURE_2D,
                0,
                x,
                y,
                dw,
                dh,
                gl.RGBA,
                gl.UNSIGNED_BYTE,
                region,
              );
            }
          } else {
            updateTexture(texOriginal, editImageData.data, w, h);
            if (maskData) {
              const maskRGBA = maskToRGBA(maskData);
              updateTexture(texMask, maskRGBA, w, h);
            }
            if (doodleLayerData) {
              updateTexture(texDoodle, doodleLayerData.data, w, h);
            }
          }

          scheduleRender(true);
        }

        window.toggleCropMode = function () {
          if (!isCropModeActive) {
            isCropModeActive = true;
            cropBtn.classList.add("active-crop");
            document.querySelectorAll(".mask-tool-btn").forEach((b) => {
              b.classList.remove("active", "doodle-active");
            });
            cropSelection = null;
            drawSelectionOverlay();
            showToast("✂️ 在画面上拖拽框选区域，松开即裁切");
          } else {
            isCropModeActive = false;
            cropBtn.classList.remove("active-crop");
            cropSelection = null;
            drawSelectionOverlay();
            showToast("✂️ 已退出裁切模式");
          }
        };

        function cropImageData(source, x, y, w, h) {
          const srcW = source.width;
          const srcH = source.height;
          const result = new ImageData(w, h);
          const src = source.data;
          const dst = result.data;

          for (let dy = 0; dy < h; dy++) {
            const srcRow = (y + dy) * srcW + x;
            const dstRow = dy * w;
            for (let dx = 0; dx < w; dx++) {
              const si = (srcRow + dx) * 4;
              const di = (dstRow + dx) * 4;
              dst[di] = src[si];
              dst[di + 1] = src[si + 1];
              dst[di + 2] = src[si + 2];
              dst[di + 3] = src[si + 3];
            }
          }
          return result;
        }

        function doCrop(sel) {
          const x = Math.max(0, Math.floor(sel.x));
          const y = Math.max(0, Math.floor(sel.y));
          const w = Math.min(editWidth - x, Math.floor(sel.w));
          const h = Math.min(editHeight - y, Math.floor(sel.h));

          if (w < 10 || h < 10) {
            showToast("❌ 裁切区域太小 (至少10×10)");
            return;
          }

          showProcessing("✂️ 裁切中...");

          setTimeout(() => {
            try {
              editImageData = cropImageData(editImageData, x, y, w, h);

              if (maskData) {
                maskData = cropImageData(maskData, x, y, w, h);
              } else {
                maskData = new ImageData(w, h);
                for (let i = 0; i < maskData.data.length; i++)
                  maskData.data[i] = 0;
              }

              if (doodleLayerData) {
                doodleLayerData = cropImageData(doodleLayerData, x, y, w, h);
              } else {
                doodleLayerData = new ImageData(w, h);
                for (let i = 0; i < doodleLayerData.data.length; i += 4) {
                  doodleLayerData.data[i] = 0;
                  doodleLayerData.data[i + 1] = 0;
                  doodleLayerData.data[i + 2] = 0;
                  doodleLayerData.data[i + 3] = 0;
                }
              }

              editWidth = w;
              editHeight = h;

              originalImageData = new ImageData(
                new Uint8ClampedArray(editImageData.data),
                w,
                h,
              );

              autoColorStats = computeAutoColorStats(editImageData);

              pushUndo();

              rebuildTextures();
              updateUI();
              applyZoomAndRender();
              cropSelection = null;
              drawSelectionOverlay();

              markEditedAfterResize();

              hideProcessing();
              showToast(`✅ 裁切完成: ${w}×${h}`);
            } catch (err) {
              console.error("裁切错误:", err);
              hideProcessing();
              showToast("⚠️ 裁切失败: " + err.message);
            }
          }, 50);
        }

        const SQUARE_GRID = 32;

        function snapSquareSelection(startX, startY, curX, curY, shiftKey) {
          const dx = curX - startX;
          const dy = curY - startY;

          // 未按 Shift：保持原矩形逻辑，返回普通矩形
          if (!shiftKey) {
            return {
              x: Math.min(startX, curX),
              y: Math.min(startY, curY),
              w: Math.abs(dx),
              h: Math.abs(dy),
            };
          }

          // Shift：正方形约束
          const signX = dx >= 0 ? 1 : -1;
          const signY = dy >= 0 ? 1 : -1;

          // Photoshop 手感：取较大位移方向作为边长
          let side = Math.max(Math.abs(dx), Math.abs(dy));
          // 向下对齐到 32 的整倍数，最小 32
          side = Math.floor(side / SQUARE_GRID) * SQUARE_GRID;
          if (side < SQUARE_GRID) side = SQUARE_GRID;

          // 起点为锚点，向拖拽方向扩展
          let x0 = signX > 0 ? startX : startX - side;
          let y0 = signY > 0 ? startY : startY - side;

          // 边界修正：平移进图像，必要时缩小
          if (x0 < 0) x0 = 0;
          if (y0 < 0) y0 = 0;
          if (x0 + side > editWidth) x0 = Math.max(0, editWidth - side);
          if (y0 + side > editHeight) y0 = Math.max(0, editHeight - side);

          // 若平移后仍越界（图像某边不足 side），缩小边长
          if (x0 + side > editWidth || y0 + side > editHeight) {
            side =
              Math.floor(
                Math.min(editWidth - x0, editHeight - y0) / SQUARE_GRID,
              ) * SQUARE_GRID;
            if (side < SQUARE_GRID) side = SQUARE_GRID;
          }

          return { x: x0, y: y0, w: side, h: side, isSquare: true };
        }

        function applyMagnetSnap(x1, y1, x2, y2, origW, origH) {
          let left = Math.min(x1, x2);
          let right = Math.max(x1, x2);
          let top = Math.min(y1, y2);
          let bottom = Math.max(y1, y2);

          if (Math.abs(left - 0) <= MAGNET_THRESHOLD) left = 0;
          if (Math.abs(right - origW) <= MAGNET_THRESHOLD) right = origW;

          if (Math.abs(top - 0) <= MAGNET_THRESHOLD) top = 0;
          if (Math.abs(bottom - origH) <= MAGNET_THRESHOLD) bottom = origH;

          return {
            x: left,
            y: top,
            w: right - left,
            h: bottom - top,
            snapped: {
              left: left === 0,
              right: right === origW,
              top: top === 0,
              bottom: bottom === origH,
            },
          };
        }

        function doExpand(sel) {
          const origW = editWidth;
          const origH = editHeight;

          const x1 = Math.round(sel.x);
          const y1 = Math.round(sel.y);
          const x2 = Math.round(sel.x + sel.w);
          const y2 = Math.round(sel.y + sel.h);

          const newW = x2 - x1;
          const newH = y2 - y1;

          if (newW <= 0 || newH <= 0) {
            showToast("❌ 扩图区域无效");
            return;
          }
          if (newW * newH > MAX_EXPAND_PIXELS) {
            showToast(
              `❌ 扩图尺寸超限: ${newW}×${newH} (${((newW * newH) / 1000000).toFixed(1)}M > ${MAX_EXPAND_PIXELS / 1000000}M)`,
            );
            return;
          }
          if (x1 === 0 && y1 === 0 && newW === origW && newH === origH) {
            showToast("💡 扩图区域与原图相同");
            return;
          }

          showProcessing("🖼️ 扩图中...");

          setTimeout(() => {
            try {
              const offsetX = -x1;
              const offsetY = -y1;

              const newEditData = new ImageData(newW, newH);
              const ed = newEditData.data;
              for (let i = 0; i < ed.length; i += 4) {
                ed[i] = 0;
                ed[i + 1] = 0;
                ed[i + 2] = 0;
                ed[i + 3] = 255;
              }
              const src = editImageData.data;
              for (let y = 0; y < origH; y++) {
                const ny = y + offsetY;
                if (ny < 0 || ny >= newH) continue;
                for (let x = 0; x < origW; x++) {
                  const nx = x + offsetX;
                  if (nx < 0 || nx >= newW) continue;
                  const si = (y * origW + x) * 4;
                  const di = (ny * newW + nx) * 4;
                  ed[di] = src[si];
                  ed[di + 1] = src[si + 1];
                  ed[di + 2] = src[si + 2];
                  ed[di + 3] = 255;
                }
              }

              const newMaskData = new ImageData(newW, newH);
              const md = newMaskData.data;
              for (let y = 0; y < newH; y++) {
                for (let x = 0; x < newW; x++) {
                  const di = (y * newW + x) * 4;
                  const inOrig =
                    x >= offsetX &&
                    x < offsetX + origW &&
                    y >= offsetY &&
                    y < offsetY + origH;
                  const v = inOrig ? 0 : 255;
                  md[di] = v;
                  md[di + 1] = v;
                  md[di + 2] = v;
                  md[di + 3] = 255;
                }
              }

              const newDoodleData = new ImageData(newW, newH);
              const dd = newDoodleData.data;
              for (let i = 0; i < dd.length; i += 4) {
                dd[i] = 0;
                dd[i + 1] = 0;
                dd[i + 2] = 0;
                dd[i + 3] = 0;
              }
              if (doodleLayerData) {
                const ds = doodleLayerData.data;
                for (let y = 0; y < origH; y++) {
                  const ny = y + offsetY;
                  if (ny < 0 || ny >= newH) continue;
                  for (let x = 0; x < origW; x++) {
                    const nx = x + offsetX;
                    if (nx < 0 || nx >= newW) continue;
                    const si = (y * origW + x) * 4;
                    const di = (ny * newW + nx) * 4;
                    dd[di] = ds[si];
                    dd[di + 1] = ds[si + 1];
                    dd[di + 2] = ds[si + 2];
                    dd[di + 3] = ds[si + 3];
                  }
                }
              }

              editImageData = newEditData;
              maskData = newMaskData;
              doodleLayerData = newDoodleData;
              editWidth = newW;
              editHeight = newH;

              originalImageData = new ImageData(
                new Uint8ClampedArray(editImageData.data),

              showToast(
                `✅ 扩图完成: ${origW}×${origH} → ${newW}×${newH} (+${addedPixels} 像素)`,

            } catch (err) {
              console.error("扩图失败:", err);
              hideProcessing();
              showToast("⚠️ 扩图失败: " + err.message);

        let morphCanvas = null;

        function rotateImageData90(source) {
          const srcW = source.width;

          const result = new ImageData(dstW, dstH);
          const src = source.data;
          const dst = result.data;

          for (let y = 0; y < srcH; y++) {
            for (let x = 0; x < srcW; x++) {
              const si = (y * srcW + x) * 4;
              const nx = srcH - 1 - y;
              const ny = x;
              const di = (ny * dstW + nx) * 4;
              dst[di] = src[si];
              dst[di + 1] = src[si + 1];
              dst[di + 2] = src[si + 2];
              dst[di + 3] = src[si + 3];
            }
          }
          return result;
        }

/**
 * 按任意角度（度）旋转图像数据，正数顺时针，负数逆时针。
 * 使用双线性插值，画布自动扩展。
 * 返回 { imageData, width, height, offsetX, offsetY }
 */
function rotateImageByAngleData(source, angleDeg, isMaskLike, isDoodleLike) {
  const srcW = source.width;
  const srcH = source.height;
  const src = source.data;

  const rad = (angleDeg * Math.PI) / 180;
  const cos = Math.cos(rad);
  const sin = -Math.sin(rad);

  const srcCx = srcW / 2;
  const srcCy = srcH / 2;

  // 包围盒：y 向下坐标系，正角度 = 顺时针
  const corners = [
    [-srcCx, -srcCy],
    [srcW - srcCx, -srcCy],
    [-srcCx, srcH - srcCy],
    [srcW - srcCx, srcH - srcCy],
  ];
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const [x, y] of corners) {
    const rx = x * cos + y * sin;
    const ry = -x * sin + y * cos;
    if (rx < minX) minX = rx;
    if (rx > maxX) maxX = rx;
    if (ry < minY) minY = ry;
    if (ry > maxY) maxY = ry;
  }
  minX = Math.floor(minX);
  minY = Math.floor(minY);
  maxX = Math.ceil(maxX);
  maxY = Math.ceil(maxY);

  const newW = Math.max(1, maxX - minX);
  const newH = Math.max(1, maxY - minY);

  const out = new ImageData(newW, newH);
  const dst = out.data;

  for (let dy = 0; dy < newH; dy++) {
    for (let dx = 0; dx < newW; dx++) {
      const rx = minX + dx + 0.5;
      const ry = minY + dy + 0.5;

      // 逆变换：y 向下坐标系，正角度 = 顺时针
      const sxRel = rx * cos - ry * sin;
      const syRel = rx * sin + ry * cos;

      const sx = sxRel + srcCx;
      const sy = syRel + srcCy;

      const di = (dy * newW + dx) * 4;

      if (sx < 0 || sx >= srcW || sy < 0 || sy >= srcH) {
        if (isDoodleLike) {
          dst[di] = 0; dst[di + 1] = 0; dst[di + 2] = 0; dst[di + 3] = 0;
        } else {
          dst[di] = 0; dst[di + 1] = 0; dst[di + 2] = 0; dst[di + 3] = 255;
        }
        continue;
      }

      const x0 = Math.floor(sx - 0.5);
      const y0 = Math.floor(sy - 0.5);
      const fx = sx - 0.5 - x0;
      const fy = sy - 0.5 - y0;

      const x0c = Math.min(srcW - 1, Math.max(0, x0));
      const y0c = Math.min(srcH - 1, Math.max(0, y0));
      const x1c = Math.min(srcW - 1, Math.max(0, x0 + 1));
      const y1c = Math.min(srcH - 1, Math.max(0, y0 + 1));

      const i00 = (y0c * srcW + x0c) * 4;
      const i10 = (y0c * srcW + x1c) * 4;
      const i01 = (y1c * srcW + x0c) * 4;
      const i11 = (y1c * srcW + x1c) * 4;

      for (let c = 0; c < 4; c++) {
        const v00 = src[i00 + c];
        const v10 = src[i10 + c];
        const v01 = src[i01 + c];
        const v11 = src[i11 + c];
        const top = v00 * (1 - fx) + v10 * fx;
        const bottom = v01 * (1 - fx) + v11 * fx;
        dst[di + c] = Math.round(top * (1 - fy) + bottom * fy);
      }
    }
  }

  if (isMaskLike) {
    for (let i = 0; i < dst.length; i += 4) {
      const v = dst[i] > 128 ? 255 : 0;
      dst[i] = v; dst[i + 1] = v; dst[i + 2] = v; dst[i + 3] = 255;
    }
  } else if (isDoodleLike) {
    for (let i = 0; i < dst.length; i += 4) {
      if (dst[i + 3] < 16) {
        dst[i] = 0; dst[i + 1] = 0; dst[i + 2] = 0; dst[i + 3] = 0;
      } else {
        dst[i + 3] = 255;
      }
    }
  }

  return { imageData: out, width: newW, height: newH };
}

window.rotateImageByAngle = function (angleDeg) {
  if (!editImageData) {
    showToast("⚠️ 没有可旋转的图片");
    return;
  }

  // 校验一致性
  if (editImageData.width !== editWidth || editImageData.height !== editHeight) {
    console.warn("尺寸不一致，自动修正 editWidth/editHeight");
    editWidth = editImageData.width;
    editHeight = editImageData.height;
  }

  showProcessing(`🔄 旋转 ${angleDeg}° 中...`);

  setTimeout(() => {
    try {
      const rotatedEdit = rotateImageByAngleData(editImageData, angleDeg, false, false);
      const newW = rotatedEdit.width;
      const newH = rotatedEdit.height;

      if (Math.max(newW, newH) > MAX_EXPORT_LONG_EDGE) {
        hideProcessing();
        showToast(`❌ 旋转后尺寸 ${newW}×${newH} 超过长边 ${MAX_EXPORT_LONG_EDGE} 限制`);
        return;
      }

      const rotatedMask = rotateImageByAngleData(maskData, angleDeg, true, false).imageData;
      const rotatedDoodle = rotateImageByAngleData(doodleLayerData, angleDeg, false, true).imageData;

      editImageData = rotatedEdit.imageData;
      maskData = rotatedMask;
      doodleLayerData = rotatedDoodle;
      editWidth = newW;
      editHeight = newH;

      originalImageData = new ImageData(new Uint8ClampedArray(editImageData.data), newW, newH);
      originalPreviewData = new ImageData(new Uint8ClampedArray(editImageData.data), newW, newH);

      if (isCropModeActive) {
        isCropModeActive = false;
        cropBtn.classList.remove("active-crop");
        cropSelection = null;
      }

      resizeEnabled = false;
      resizeEditedAfter = false;
      resizeRatioValue = 1.0;
      resizeRatioInput.value = "1.00";
      updateResizeUI();

      glCanvas.width = newW;
      glCanvas.height = newH;
      glCanvas.style.width = newW + "px";
      glCanvas.style.height = newH + "px";

      pushUndo();
      rebuildTextures();
      updateUI();
      fitToScreen();
      drawSelectionOverlay();
      renderGL();

      markEditedAfterResize();

      hideProcessing();
      showToast(`✅ 已旋转 ${angleDeg}°: ${editWidth}×${editHeight}`);
    } catch (err) {
      console.error("旋转错误:", err);
      hideProcessing();
      showToast("⚠️ 旋转失败: " + err.message);
    }
  }, 50);
};

        function computeDistanceFields(maskDataCopy, w, h) {
          const total = w * h;
          const INF = 999999;

          const isMask = new Uint8Array(total);
          for (let i = 0; i < total; i++) {
            const idx = i * 4;
            isMask[i] = maskDataCopy[idx] > 128 ? 1 : 0;
          }

          const innerDist = new Float32Array(total);
          const queue1 = [];

          for (let i = 0; i < total; i++) {
            if (isMask[i] === 0) {
              innerDist[i] = 0;
              continue;
            }
            const y = Math.floor(i / w);
            const x = i % w;
            let isEdge = false;
            for (let dy = -1; dy <= 1 && !isEdge; dy++) {
              for (let dx = -1; dx <= 1 && !isEdge; dx++) {
                if (dy === 0 && dx === 0) continue;
                const ny = y + dy;
                const nx = x + dx;
                if (ny < 0 || ny >= h || nx < 0 || nx >= w) {
                  isEdge = true;
                  break;
                }
                const nIdx = ny * w + nx;
                if (isMask[nIdx] === 0) {
                  isEdge = true;
                  break;
                }
              }
            }
            if (isEdge) {
              innerDist[i] = 0;
              queue1.push(i);
            } else {
              innerDist[i] = INF;
            }
          }

          let head1 = 0;
          while (head1 < queue1.length) {
            const idx = queue1[head1++];
            const y = Math.floor(idx / w);
            const x = idx % w;
            const currentDist = innerDist[idx] + 1;

            const neighbors = [
              [y - 1, x],
              [y + 1, x],
              [y, x - 1],
              [y, x + 1],
            ];
            for (const [ny, nx] of neighbors) {
              if (ny < 0 || ny >= h || nx < 0 || nx >= w) continue;
              const nIdx = ny * w + nx;
              if (isMask[nIdx] === 1 && innerDist[nIdx] === INF) {
                innerDist[nIdx] = currentDist;
                queue1.push(nIdx);
              }
            }
          }

          const outerDist = new Float32Array(total);
          const queue2 = [];

          for (let i = 0; i < total; i++) {
            if (isMask[i] === 1) {
              outerDist[i] = 0;
              continue;
            }
            const y = Math.floor(i / w);
            const x = i % w;
            let isEdge = false;
            for (let dy = -1; dy <= 1 && !isEdge; dy++) {
              for (let dx = -1; dx <= 1 && !isEdge; dx++) {
                if (dy === 0 && dx === 0) continue;
                const ny = y + dy;
                const nx = x + dx;
                if (ny < 0 || ny >= h || nx < 0 || nx >= w) continue;
                const nIdx = ny * w + nx;
                if (isMask[nIdx] === 1) {
                  isEdge = true;
                  break;
                }
              }
            }
            if (isEdge) {
              outerDist[i] = 1;
              queue2.push(i);
            } else {
              outerDist[i] = INF;
            }
          }

          let head2 = 0;
          while (head2 < queue2.length) {
            const idx = queue2[head2++];
            const y = Math.floor(idx / w);
            const x = idx % w;
            const currentDist = outerDist[idx] + 1;

            const neighbors = [
              [y - 1, x],
              [y + 1, x],
              [y, x - 1],
              [y, x + 1],
            ];
            for (const [ny, nx] of neighbors) {
              if (ny < 0 || ny >= h || nx < 0 || nx >= w) continue;
              const nIdx = ny * w + nx;
              if (isMask[nIdx] === 0 && outerDist[nIdx] === INF) {
                outerDist[nIdx] = currentDist;
                queue2.push(nIdx);
              }
            }
          }

          for (let i = 0; i < total; i++) {
            if (outerDist[i] === INF) outerDist[i] = 0;
          }

        window.expandMask = function () {

          let hasContent = false;

                const distToMask = outerDist[i];
                const shouldBeMask =
                  isOriginalMask || (distToMask > 0 && distToMask <= radius);
                const newVal = shouldBeMask ? 255 : 0;

                if (data[idx] !== newVal) {
                  if (newVal === 255 && !isOriginalMask) addedCount++;
                  if (newVal === 0 && isOriginalMask) removedCount++;
                  data[idx] = newVal;
                  data[idx + 1] = newVal;
                  data[idx + 2] = newVal;

        window.clearLayer = function (layer) {

        function floodFillGPU(startX, startY, isDoodle) {
          const layer = isDoodle ? doodleLayerData : maskData;
          if (!layer) return;
          const w = editWidth,
            h = editHeight;
          if (startX < 0 || startX >= w || startY < 0 || startY >= h) return;

          const isEraser = isDoodle
            ? currentTool === "doodleEraser"
            : currentTool === "eraser";

          if (isDoodle) {
            const idx = (startY * w + startX) * 4;
            const targetR = layer.data[idx];
            const targetG = layer.data[idx + 1];
            const targetB = layer.data[idx + 2];
            const fillColor = isEraser
              ? { r: 0, g: 0, b: 0 }
              : hexToRgb(doodleColor);
            const fillAlpha = isEraser ? 0 : 255;
            if (
              targetR === fillColor.r &&
              targetG === fillColor.g &&
              targetB === fillColor.b
            ) {
              showToast("💡 颜色相同，无需填充");
              return;
            }

            const data = layer.data;
            const maskPixels = new Uint8ClampedArray(w * h * 4);
            for (let i = 0; i < data.length; i += 4) {
              const dist =
                Math.abs(data[i] - targetR) +
                Math.abs(data[i + 1] - targetG) +
                Math.abs(data[i + 2] - targetB);
              const val = dist < 60 ? 255 : 0;
              maskPixels[i] = val;
              maskPixels[i + 1] = val;
              maskPixels[i + 2] = val;
              maskPixels[i + 3] = 255;
            }

            const visited = new Uint8Array(w * h);
            const queue = [startX, startY];
            const fillIndices = [];
            let head = 0;
            while (head < queue.length) {
              const x = queue[head++];
              const y = queue[head++];
              if (x < 0 || x >= w || y < 0 || y >= h) continue;
              const idx2 = y * w + x;
              if (visited[idx2]) continue;
              if (maskPixels[idx2 * 4] < 128) continue;
              visited[idx2] = 1;
              fillIndices.push(idx2);
              if (x > 0) queue.push(x - 1, y);
              if (x < w - 1) queue.push(x + 1, y);
              if (y > 0) queue.push(x, y - 1);
              if (y < h - 1) queue.push(x, y + 1);
            }

            if (fillIndices.length === 0) {
              showToast("💡 没有可填充的区域");
              return;
            }

            const totalPixels = w * h;
            if (fillIndices.length > totalPixels * 0.8) {
              for (let i = 0; i < data.length; i += 4) {
                data[i] = fillColor.r;
                data[i + 1] = fillColor.g;
                data[i + 2] = fillColor.b;
                data[i + 3] = fillAlpha;
              }
            } else {
              for (const idx2 of fillIndices) {
                const i = idx2 * 4;
                data[i] = fillColor.r;
                data[i + 1] = fillColor.g;
                data[i + 2] = fillColor.b;
                data[i + 3] = fillAlpha;
              }
              const expanded = new Uint8Array(w * h);
              for (const idx2 of fillIndices) expanded[idx2] = 1;
              for (const idx2 of fillIndices) {
                const y0 = Math.floor(idx2 / w);
                const x0 = idx2 % w;
                for (let dy = -1; dy <= 1; dy++) {
                  for (let dx = -1; dx <= 1; dx++) {
                    const nx = x0 + dx,
                      ny = y0 + dy;
                    if (nx < 0 || nx >= w || ny < 0 || ny >= h) continue;
                    const nidx = ny * w + nx;
                    if (expanded[nidx]) continue;
                    expanded[nidx] = 1;
                    const i = nidx * 4;
                    data[i] = fillColor.r;
                    data[i + 1] = fillColor.g;
                    data[i + 2] = fillColor.b;
                    data[i + 3] = fillAlpha;
                  }
                }
              }
            }
          } else {
            const idx = (startY * w + startX) * 4;
            const targetColor = layer.data[idx];
            const fillColor = isEraser ? 0 : 255;
            if (targetColor === fillColor) {
              showToast("💡 颜色相同，无需填充");
              return;
            }

            const data = layer.data;
            const maskPixels = new Uint8ClampedArray(w * h * 4);
            for (let i = 0; i < data.length; i += 4) {
              const val = Math.abs(data[i] - targetColor) < 30 ? 255 : 0;
              maskPixels[i] = val;
              maskPixels[i + 1] = val;
              maskPixels[i + 2] = val;
              maskPixels[i + 3] = 255;
            }

            const visited = new Uint8Array(w * h);
            const queue = [startX, startY];
            const fillIndices = [];
            let head = 0;
            while (head < queue.length) {
              const x = queue[head++];
              const y = queue[head++];
              if (x < 0 || x >= w || y < 0 || y >= h) continue;
              const idx2 = y * w + x;
              if (visited[idx2]) continue;
              if (maskPixels[idx2 * 4] < 128) continue;
              visited[idx2] = 1;
              fillIndices.push(idx2);
              if (x > 0) queue.push(x - 1, y);
              if (x < w - 1) queue.push(x + 1, y);
              if (y > 0) queue.push(x, y - 1);
              if (y < h - 1) queue.push(x, y + 1);
            }

            if (fillIndices.length === 0) {
              showToast("💡 没有可填充的区域");
              return;
            }

            const totalPixels = w * h;
            if (fillIndices.length > totalPixels * 0.8) {
              for (let i = 0; i < data.length; i += 4) {
                data[i] = fillColor;
                data[i + 1] = fillColor;
                data[i + 2] = fillColor;
                data[i + 3] = 255;
              }
            } else {
              for (const idx2 of fillIndices) {
                const i = idx2 * 4;
                data[i] = fillColor;
                data[i + 1] = fillColor;
                data[i + 2] = fillColor;
                data[i + 3] = 255;
              }
            }
          }

          if (isCropModeActive) {
            isCropModeActive = false;
            cropBtn.classList.remove("active-crop");
            cropSelection = null;
            drawSelectionOverlay();
          }

          pushUndo();
          updateTexturesAndRender();

          markEditedAfterResize();
        }

        function floodFill(x, y) {
          floodFillGPU(x, y, false);

        function doodleFloodFill(x, y) {
          floodFillGPU(x, y, true);
        }

        function applySelection() {
          if (!selection || !maskData) return;
          const s = selection;
          const w = editWidth,
            h = editHeight;
          const data = maskData.data;
          const isEraser = currentTool === "eraser";
          const value = isEraser ? 0 : 255;
          const isCircle = currentTool === "circle";

          let modified = false;
          for (let y = Math.max(0, s.y); y < Math.min(h, s.y + s.h); y++) {
            for (let x = Math.max(0, s.x); x < Math.min(w, s.x + s.w); x++) {
              if (isCircle) {
                const cx = s.x + s.w / 2,
                  cy = s.y + s.h / 2;
                const rx = s.w / 2,
                  ry = s.h / 2;
                if (((x - cx) / rx) ** 2 + ((y - cy) / ry) ** 2 > 1) continue;
              }
              const idx = (y * w + x) * 4;
              if (data[idx] !== value) {
                data[idx] = value;
                data[idx + 1] = value;
                data[idx + 2] = value;
                data[idx + 3] = 255;
                modified = true;
              }
            }

          if (!modified) {
            showToast("💡 选区内容未改变");

          if (isCropModeActive) {

        function applyDoodleSelection() {
          if (!doodleSelection || !doodleLayerData) return;
          const s = doodleSelection;
          const w = editWidth,
            h = editHeight;
          const data = doodleLayerData.data;
          const isEraser = currentTool === "doodleEraser";
          const isCircle = currentTool === "doodleCircle";
          const color = isEraser ? { r: 0, g: 0, b: 0 } : hexToRgb(doodleColor);
          const alpha = isEraser ? 0 : 255;

          let modified = false;
          for (let y = Math.max(0, s.y); y < Math.min(h, s.y + s.h); y++) {
            for (let x = Math.max(0, s.x); x < Math.min(w, s.x + s.w); x++) {

                if (((x - cx) / rx) ** 2 + ((y - cy) / ry) ** 2 > 1) continue;
              }
              const idx = (y * w + x) * 4;
              if (

        function pickColorAt(x, y) {
          if (
            !editImageData ||
            x < 0 ||
            x >= editWidth ||
            y < 0 ||
            y >= editHeight
          )
            return null;
          const idx = (Math.floor(y) * editWidth + Math.floor(x)) * 4;
          const d = editImageData.data;
          const r = d[idx];
          const g = d[idx + 1];
          const b = d[idx + 2];
          return (
            "#" + [r, g, b].map((v) => v.toString(16).padStart(2, "0")).join("")
          );

        function updateDoodleColorFromPick(hex) {

          doodleColorPicker.value = hex;

        function onMouseDown(e) {
          if (e.button !== 0) return;

          const pos = getCanvasCoords(e);
          const x = Math.round(pos.x),
            y = Math.round(pos.y);
          lastX = x;
          lastY = y;

          if (isEyedropperActive && e.altKey) {
            e.preventDefault();
            lastMouseClientX = e.clientX;
            lastMouseClientY = e.clientY;
            const hex = pickColorAt(x, y);
            if (hex) {
              updateDoodleColorFromPick(hex);
              showToast("🎨 取色: " + hex);
            }
            drawAllOverlay(lastMouseClientX, lastMouseClientY);
            return;
          }

          if (e.ctrlKey) {
            e.preventDefault();
            isExpandSelecting = true;
            expandStartX = x;
            expandStartY = y;
            expandSelection = { x: x, y: y, w: 0, h: 0 };

            if (isCropModeActive) {
              isCropModeActive = false;
              cropBtn.classList.remove("active-crop");
              cropSelection = null;
            }

            if (expandModeBadge) expandModeBadge.classList.add("active");
            drawSelectionOverlay();

          if (currentTool === "doodleFill") {

            isDrawing = true;
            drawStrokeCPU(x, y, x + 0.1, y + 0.1, "mask");

          }
          if (currentTool === "rect" || currentTool === "circle") {
            isSelecting = true;
            selectStartX = x;
            selectStartY = y;
            selection = null;
            return;

          if (currentTool === "fill") {
            floodFill(x, y);

        function onMouseMove(e) {
          const hostRect = getCursorHost().getBoundingClientRect();
          const inWrapper =
            e.clientX >= hostRect.left &&
            e.clientX <= hostRect.right &&
            e.clientY >= hostRect.top &&
            e.clientY <= hostRect.bottom;

          if (inWrapper) {
            lastMouseClientX = e.clientX;
            lastMouseClientY = e.clientY;

          if (isPanning) {
            cursorCtx.clearRect(0, 0, cursorCanvas.width, cursorCanvas.height);
            if (inWrapper) {
              drawPanCursor(e.clientX, e.clientY);

            return;
          }

          const isDraggingAny =
            isDrawing ||
            isDoodleDrawing ||
            isSelecting ||
            isDoodleSelecting ||
            isCropSelecting ||
            isExpandSelecting;

          if (!inWrapper && !isDraggingAny) {
            clearCursor();
            return;

          const pos = getCanvasCoords(e);
          const x = Math.round(pos.x),
            y = Math.round(pos.y);

          drawAllOverlay(e.clientX, e.clientY);

          if (isEyedropperActive && e.altKey) {
            const hex = pickColorAt(x, y);
            if (hex) {
              lastPickedColor = hex;

            drawAllOverlay(e.clientX, e.clientY);

          if (isExpandSelecting) {

              y,

            expandSelection = {

          if (isCropSelecting && isCropModeActive) {

              x: Math.min(cropStartX, x),

          if (

              w: Math.abs(x - doodleSelectStartX),
              h: Math.abs(y - doodleSelectStartY),

         if (isSelecting) {

              // 矩形工具：Shift 按下时约束为正方形（边长 32 整倍数），否则保持原矩形
              selection = snapSquareSelection(

                y,

              // 圆形等其他选区保持原逻辑
              selection = {
                x: Math.min(selectStartX, x),
                y: Math.min(selectStartY, y),
                w: Math.abs(x - selectStartX),
                h: Math.abs(y - selectStartY),
              };

            drawAllOverlay(e.clientX, e.clientY);

        const GAMMA_MIN = 0.1;
        const GAMMA_MAX = 10.0;
        const GAMMA_DEFAULT = 1.0;
        const MIN_LEVEL_GAP = 2;

        function gammaToRelPos(gamma) {
          const g = Math.max(GAMMA_MIN, Math.min(GAMMA_MAX, gamma));
          const logMax = Math.log(GAMMA_MAX);
          const t = Math.log(g) / logMax;
          return 0.5 + t * 0.5;
        }
        function relPosToGamma(relT) {
          const p = Math.max(0, Math.min(1, relT));
          const logMax = Math.log(GAMMA_MAX);
          const t = (p - 0.5) * 2;
          return Math.exp(t * logMax);
        }

        function blackToPos(v) {
          return v / 255;
        }
        function whiteToPos(v) {
          return v / 255;
        }
        function posToBlack(p) {
          return Math.round(Math.max(0, Math.min(255, p * 255)));
        }
        function posToWhite(p) {
          return Math.round(Math.max(0, Math.min(255, p * 255)));
        }

        function updateLevelsUI() {
          const black = colorParams.levelsBlack;

          const blackPos = blackToPos(black);
          const whitePos = whiteToPos(white);

          levelsHandleBlack.style.left = blackPos * 100 + "%";
          levelsHandleWhite.style.left = whitePos * 100 + "%";

          const relT = gammaToRelPos(gamma);
          const gammaGlobalPos = blackPos + relT * (whitePos - blackPos);
          levelsHandleGamma.style.left = gammaGlobalPos * 100 + "%";

          if (document.activeElement !== levelsBlackVal) {
            levelsBlackVal.value = black;

        function getLevelsPointerPos(e) {
          const widget =
            levelsDragTarget === "outputBlack" ||
            levelsDragTarget === "outputWhite"
              ? levelsOutputWidget

        function onLevelsPointerDown(e) {
          const handle = e.target.closest(".levels-handle");
          if (!handle) return;

          levelsDragTarget = handle.dataset.handle;
          levelsDragStartBlack = colorParams.levelsBlack;
          levelsDragStartWhite = colorParams.levelsWhite;
          levelsDragStartGamma = colorParams.levelsGamma;
          levelsDragMoved = false;

          handle.classList.add("dragging");

        function onLevelsPointerMove(e) {
          if (!levelsDragTarget) return;
          e.preventDefault();

          if (Math.abs(e.clientX - levelsDragStartX) > 1) {
            levelsDragMoved = true;
          }

          const pos = getLevelsPointerPos(e);
          const black = colorParams.levelsBlack;
          const white = colorParams.levelsWhite;

          if (levelsDragTarget === "black") {
            let v = posToBlack(pos);
            v = Math.max(0, Math.min(white - MIN_LEVEL_GAP, v));
            colorParams.levelsBlack = v;
          } else if (levelsDragTarget === "white") {
            let v = posToWhite(pos);
            v = Math.min(255, Math.max(black + MIN_LEVEL_GAP, v));
            colorParams.levelsWhite = v;
          } else if (levelsDragTarget === "gamma") {
            const blackPos = blackToPos(black);
            const whitePos = whiteToPos(white);
            const span = Math.max(whitePos - blackPos, 1e-6);

            const relT = (pos - blackPos) / span;
            colorParams.levelsGamma = relPosToGamma(
              Math.max(0, Math.min(1, relT)),
            );
          } else if (levelsDragTarget === "outputBlack") {
            let v = posToBlack(pos);

              0,
              Math.min(colorParams.levelsOutputWhite - MIN_LEVEL_GAP, v),
            );
            colorParams.levelsOutputBlack = v;
          } else if (levelsDragTarget === "outputWhite") {
            let v = posToWhite(pos);
            v = Math.min(
              255,
              Math.max(colorParams.levelsOutputBlack + MIN_LEVEL_GAP, v),
            );
            colorParams.levelsOutputWhite = v;

          exitColorResetState();

        function getFinalImageData() {
          const w = editWidth,
            h = editHeight;
          const data = new ImageData(
            new Uint8ClampedArray(editImageData.data),
            w,
            h,
          );
          const dst = data.data;

          const saturation = colorParams.saturation / 100;
          const rBias = colorParams.red / 100;
          const gBias = colorParams.green / 100;
          const bBias = colorParams.blue / 100;
          const satFactor = 1 + saturation;

          const autoU = computeAutoUniforms(
            colorParams.autoContrast / 100,
            colorParams.autoColor / 100,
          );
          const aR = autoU.a[0],
            aG = autoU.a[1],
            aB = autoU.a[2];
          const bR = autoU.b[0],
            bG = autoU.b[1],
            bB = autoU.b[2];
          const oR = autoU.offset[0],
            oG = autoU.offset[1],
            oB = autoU.offset[2];

          const levelsNoop = isLevelsNoop();
          const levelsLUT = levelsNoop ? null : buildLevelsLUT();

          const textureAmount = (colorParams.texture / 100) * TEXTURE_GAIN;
          const useTexture =
            Math.abs(textureAmount) > 1e-6 && smallBlurCPU && largeBlurCPU;

          for (let i = 0; i < dst.length; i += 4) {
            let r = dst[i] / 255,
              g = dst[i + 1] / 255,
              b = dst[i + 2] / 255;

            if (useTexture) {
              const px = (i / 4) % w;
              const py = Math.floor(i / 4 / w);
              const wL = Math.max(px - 1, 0);
              const wR = Math.min(px + 1, w - 1);
              const wU = Math.max(py - 1, 0);
              const wD = Math.min(py + 1, h - 1);

              const idxL = (py * w + wL) * 4;
              const idxR = (py * w + wR) * 4;
              const idxU = (wU * w + px) * 4;
              const idxD = (wD * w + px) * 4;

              const gxR = dst[idxR] - dst[idxL];
              const gxG = dst[idxR + 1] - dst[idxL + 1];
              const gxB = dst[idxR + 2] - dst[idxL + 2];
              const gyR = dst[idxD] - dst[idxU];
              const gyG = dst[idxD + 1] - dst[idxU + 1];
              const gyB = dst[idxD + 2] - dst[idxU + 2];

              const gx =
                Math.sqrt((gxR * gxR + gxG * gxG + gxB * gxB) / 3) / 255;
              const gy =
                Math.sqrt((gyR * gyR + gyG * gyG + gyB * gyB) / 3) / 255;
              const grad = Math.sqrt(gx * gx + gy * gy);

              let maskW;
              if (grad <= EDGE_MASK_LOW) maskW = 1.0;
              else if (grad >= EDGE_MASK_HIGH) maskW = 0.0;
              else {
                const t =
                  (grad - EDGE_MASK_LOW) / (EDGE_MASK_HIGH - EDGE_MASK_LOW);
                maskW = 1.0 - t * t * (3 - 2 * t);
              }

              const sr = smallBlurCPU[i] / 255;
              const sg = smallBlurCPU[i + 1] / 255;
              const sb = smallBlurCPU[i + 2] / 255;
              const lr = largeBlurCPU[i] / 255;
              const lg = largeBlurCPU[i + 1] / 255;
              const lb = largeBlurCPU[i + 2] / 255;

              r += textureAmount * (sr - lr) * maskW;
              g += textureAmount * (sg - lg) * maskW;
              b += textureAmount * (sb - lb) * maskW;
              r = Math.min(1, Math.max(0, r));
              g = Math.min(1, Math.max(0, g));
              b = Math.min(1, Math.max(0, b));
            }

            r = aR * r + bR + oR;
            g = aG * g + bG + oG;
            b = aB * b + bB + oB;
            r = Math.min(1, Math.max(0, r));
            g = Math.min(1, Math.max(0, g));
            b = Math.min(1, Math.max(0, b));

            if (!levelsNoop) {
              r = levelsLUT[Math.round(r * 255)] / 255;
              g = levelsLUT[Math.round(g * 255)] / 255;
              b = levelsLUT[Math.round(b * 255)] / 255;
            }

            const brightAdd = (colorParams.brightness / 100) * 0.5;
            const contrastK = 1 + colorParams.contrast / 100;
            r = (r + brightAdd - 0.5) * contrastK + 0.5;
            g = (g + brightAdd - 0.5) * contrastK + 0.5;
            b = (b + brightAdd - 0.5) * contrastK + 0.5;
            r = Math.min(1, Math.max(0, r));
            g = Math.min(1, Math.max(0, g));
            b = Math.min(1, Math.max(0, b));

            r *= 255;
            g *= 255;
            b *= 255;
            r += rBias * 64;
            g += gBias * 64;
            b += bBias * 64;
            const gray = 0.299 * r + 0.587 * g + 0.114 * b;
            r = gray + (r - gray) * satFactor;
            g = gray + (g - gray) * satFactor;
            b = gray + (b - gray) * satFactor;

            dst[i] = Math.max(0, Math.min(255, r));
            dst[i + 1] = Math.max(0, Math.min(255, g));
            dst[i + 2] = Math.max(0, Math.min(255, b));
          }

          return data;
        }

        const MITCHELL_B = 1 / 3;
        const MITCHELL_C = 1 / 3;

        function mitchellKernel(x) {
          const ax = Math.abs(x);
          const x2 = ax * ax;
          const x3 = x2 * ax;
          if (ax < 1) {
            return (
              ((12 - 9 * MITCHELL_B - 6 * MITCHELL_C) * x3 +
                (-18 + 12 * MITCHELL_B + 6 * MITCHELL_C) * x2 +
                (6 - 2 * MITCHELL_B)) /
              6
            );
          } else if (ax < 2) {
            return (
              ((-MITCHELL_B - 6 * MITCHELL_C) * x3 +
                (6 * MITCHELL_B + 30 * MITCHELL_C) * x2 +
                (-12 * MITCHELL_B - 48 * MITCHELL_C) * ax +
                (8 * MITCHELL_B + 24 * MITCHELL_C)) /
              6
            );
          }
          return 0;
        }

        function resampleImageData(
          src,
          dstW,
          dstH,
          useArea,
          isMaskLike,
          isDoodleLike,
        ) {
          const srcW = src.width;
          const srcH = src.height;
          const srcData = src.data;

          const tmpW = dstW;
          const tmpH = srcH;
          const tmp = new Float32Array(tmpW * tmpH * 4);

          if (useArea) {
            for (let y = 0; y < srcH; y++) {
              for (let x = 0; x < dstW; x++) {
                const sx0 = (x * srcW) / dstW;
                const sx1 = ((x + 1) * srcW) / dstW;
                const ix0 = Math.floor(sx0);
                const ix1 = Math.min(srcW, Math.ceil(sx1));
                const count = ix1 - ix0;
                let r = 0,
                  g = 0,
                  b = 0,
                  a = 0;
                for (let sx = ix0; sx < ix1; sx++) {
                  const si = (y * srcW + sx) * 4;
                  r += srcData[si];
                  g += srcData[si + 1];
                  b += srcData[si + 2];
                  a += srcData[si + 3];
                }
                const di = (y * dstW + x) * 4;
                tmp[di] = r / count;
                tmp[di + 1] = g / count;
                tmp[di + 2] = b / count;
                tmp[di + 3] = a / count;
              }
            }
          } else {
            const radius = 2;
            for (let y = 0; y < srcH; y++) {
              for (let x = 0; x < dstW; x++) {
                const center = ((x + 0.5) * srcW) / dstW - 0.5;
                const left = Math.ceil(center - radius);
                const right = Math.floor(center + radius);
                let r = 0,
                  g = 0,
                  b = 0,
                  a = 0;
                let wsum = 0;
                for (let sx = left; sx <= right; sx++) {
                  const clamped = Math.max(0, Math.min(srcW - 1, sx));
                  const w = mitchellKernel(center - sx);
                  const si = (y * srcW + clamped) * 4;
                  r += srcData[si] * w;
                  g += srcData[si + 1] * w;
                  b += srcData[si + 2] * w;
                  a += srcData[si + 3] * w;
                  wsum += w;
                }
                if (wsum === 0) wsum = 1;
                const di = (y * dstW + x) * 4;
                tmp[di] = r / wsum;
                tmp[di + 1] = g / wsum;
                tmp[di + 2] = b / wsum;
                tmp[di + 3] = a / wsum;
              }
            }
          }

          const out = new ImageData(dstW, dstH);
          const outData = out.data;

          if (useArea) {
            for (let y = 0; y < dstH; y++) {
              const sy0 = (y * srcH) / dstH;
              const sy1 = ((y + 1) * srcH) / dstH;
              const iy0 = Math.floor(sy0);
              const iy1 = Math.min(srcH, Math.ceil(sy1));
              const count = iy1 - iy0;
              for (let x = 0; x < dstW; x++) {
                let r = 0,
                  g = 0,
                  b = 0,
                  a = 0;
                for (let sy = iy0; sy < iy1; sy++) {
                  const si = (sy * dstW + x) * 4;
                  r += tmp[si];
                  g += tmp[si + 1];
                  b += tmp[si + 2];
                  a += tmp[si + 3];
                }
                const di = (y * dstW + x) * 4;
                outData[di] = r / count;
                outData[di + 1] = g / count;
                outData[di + 2] = b / count;
                outData[di + 3] = a / count;
              }
            }
          } else {
            const radius = 2;
            for (let y = 0; y < dstH; y++) {
              const center = ((y + 0.5) * srcH) / dstH - 0.5;
              const top = Math.ceil(center - radius);
              const bottom = Math.floor(center + radius);
              for (let x = 0; x < dstW; x++) {
                let r = 0,
                  g = 0,
                  b = 0,
                  a = 0;
                let wsum = 0;
                for (let sy = top; sy <= bottom; sy++) {
                  const clamped = Math.max(0, Math.min(srcH - 1, sy));
                  const w = mitchellKernel(center - sy);
                  const si = (clamped * dstW + x) * 4;
                  r += tmp[si] * w;
                  g += tmp[si + 1] * w;
                  b += tmp[si + 2] * w;
                  a += tmp[si + 3] * w;
                  wsum += w;
                }
                if (wsum === 0) wsum = 1;
                const di = (y * dstW + x) * 4;
                outData[di] = r / wsum;
                outData[di + 1] = g / wsum;
                outData[di + 2] = b / wsum;
                outData[di + 3] = a / wsum;
              }
            }
          }

          if (isMaskLike) {
            for (let i = 0; i < outData.length; i += 4) {
              const v = outData[i] > 128 ? 255 : 0;
              outData[i] = v;
              outData[i + 1] = v;
              outData[i + 2] = v;
              outData[i + 3] = 255;
            }
          } else if (isDoodleLike) {
            for (let i = 0; i < outData.length; i += 4) {
              if (outData[i + 3] < 16) {
                outData[i] = 0;
                outData[i + 1] = 0;
                outData[i + 2] = 0;
                outData[i + 3] = 0;
              } else {
                outData[i + 3] = 255;
              }
            }
          }

          return out;
        }

        function resizeImageDataForExport(
          src,
          dstW,
          dstH,
          useArea,
          isMaskLike,
          isDoodleLike,
        ) {
          return resampleImageData(
            src,
            dstW,
            dstH,
            useArea,
            isMaskLike,
            isDoodleLike,
          );
        }

        function updateResizeUI() {
          if (!editWidth || !editHeight) {
            resizeTargetPreview.textContent = "→ - × -";
            resizeStatus.textContent = "";
            resizeStatus.classList.remove("locked");
            return;
          }

          const raw = parseFloat(resizeRatioInput.value);
          if (isNaN(raw) || raw <= 0) {
            resizeTargetPreview.textContent = "→ 输入无效";
            resizeTargetPreview.classList.add("warn");
            resizeStatus.textContent = "";
            resizeStatus.classList.remove("locked");
            return;
          }

          const ratio = Math.round(raw * 100) / 100;
          const newW = Math.max(1, Math.round(editWidth * ratio));
          const newH = Math.max(1, Math.round(editHeight * ratio));
          const longEdge = Math.max(newW, newH);

          resizeTargetPreview.textContent = "→ " + newW + " × " + newH;

          if (longEdge > MAX_EXPORT_LONG_EDGE) {
            resizeTargetPreview.classList.add("warn");
            resizeStatus.textContent =
              "⚠️ 长边超 " + MAX_EXPORT_LONG_EDGE + "，导出将被拒绝";
            resizeStatus.classList.add("locked");
          } else {
            resizeTargetPreview.classList.remove("warn");
            if (Math.abs(ratio - 1) < 1e-6) {
              resizeStatus.textContent = "不缩放";
              resizeStatus.classList.remove("locked");
            } else if (ratio <= 0.5) {
              resizeStatus.textContent = "Area/Box（大幅缩小）";
              resizeStatus.classList.remove("locked");
            } else if (ratio > 1.0) {
              resizeStatus.textContent = "Mitchell（放大）";
              resizeStatus.classList.remove("locked");
            } else {
              resizeStatus.textContent = "Mitchell（轻微缩小）";
              resizeStatus.classList.remove("locked");
            }
          }
        }

        function commitResizeRatio() {
          if (!editWidth || !editHeight) return;

          const raw = parseFloat(resizeRatioInput.value);
          if (isNaN(raw) || raw <= 0) {
            showToast("❌ 缩放比例无效");
            updateResizeUI();
            return;
          }

          const ratio = Math.round(raw * 100) / 100;
          const newW = Math.max(1, Math.round(editWidth * ratio));
          const newH = Math.max(1, Math.round(editHeight * ratio));
          const longEdge = Math.max(newW, newH);

          if (longEdge > MAX_EXPORT_LONG_EDGE) {
            showToast(
              "❌ 目标尺寸 " +
                newW +
                "×" +
                newH +
                " 超过长边 " +
                MAX_EXPORT_LONG_EDGE +
                " 限制",
            );
            updateResizeUI();
            return;
          }

          resizeRatioInput.value = ratio.toFixed(2);
          resizeRatioValue = ratio;

          if (Math.abs(ratio - 1) < 1e-6) {
            resizeEnabled = false;
            resizeEditedAfter = false;
            resizeStatus.textContent = "不缩放";
            resizeStatus.classList.remove("locked");
            showToast("💡 已取消导出缩放");
          } else {
            const wasEnabled = resizeEnabled;
            resizeEnabled = true;
            if (!wasEnabled) {
              resizeEditedAfter = false;
            } else {
              resizeEditedAfter = false;
            }
            updateResizeUI();
            showToast(
              "✅ 导出缩放已启用: " +
                ratio.toFixed(2) +
                "x → " +
                newW +
                "×" +
                newH,
            );
          }

          updateResizeUI();
        }

        function markEditedAfterResize() {
          if (resizeEnabled) {
            resizeEditedAfter = true;
            resizeStatus.textContent = "⚠️ 缩放后已有编辑，保存时将被拒绝";
            resizeStatus.classList.add("locked");
          }
        }

        resizeRatioInput.addEventListener("input", function () {
          updateResizeUI();
        });
        resizeRatioInput.addEventListener("change", function () {
          commitResizeRatio();
        });
        resizeRatioInput.addEventListener("blur", function () {
          commitResizeRatio();
        });

        function generateOutputImages() {
          const w = editWidth,
            h = editHeight;
          const finalData = getFinalImageData();

          let exportW = w;
          let exportH = h;
          let exportEdit = finalData;
          let exportMask = maskData;
          let exportDoodle = doodleLayerData;

          if (resizeEnabled && Math.abs(resizeRatioValue - 1) > 1e-6) {
            const ratio = resizeRatioValue;
            exportW = Math.max(1, Math.round(w * ratio));
            exportH = Math.max(1, Math.round(h * ratio));

            if (Math.max(exportW, exportH) > MAX_EXPORT_LONG_EDGE) {
              throw new Error(
                "目标尺寸 " +
                  exportW +
                  "×" +
                  exportH +
                  " 超过长边 " +
                  MAX_EXPORT_LONG_EDGE +
                  " 限制",
              );
            }

            const useArea = ratio <= 0.5;
            exportEdit = resizeImageDataForExport(
              finalData,
              exportW,
              exportH,
              useArea,
              false,
              false,
            );
            if (maskData) {
              exportMask = resizeImageDataForExport(
                maskData,
                exportW,
                exportH,
                useArea,
                true,
                false,
              );
            }
            if (doodleLayerData) {
              exportDoodle = resizeImageDataForExport(
                doodleLayerData,
                exportW,
                exportH,
                useArea,
                false,
                true,
              );
            }
          }

          const mainCanvas = document.createElement("canvas");
          mainCanvas.width = exportW;
          mainCanvas.height = exportH;
          const mainCtx = mainCanvas.getContext("2d");
          mainCtx.putImageData(exportEdit, 0, 0);

          if (exportDoodle) {
            const doodleCanvas = document.createElement("canvas");
            doodleCanvas.width = exportW;
            doodleCanvas.height = exportH;
            const doodleCtx = doodleCanvas.getContext("2d");
            doodleCtx.putImageData(exportDoodle, 0, 0);
            mainCtx.globalAlpha = doodleAlphaEnabled ? DOODLE_ALPHA : 1.0;
            mainCtx.drawImage(doodleCanvas, 0, 0);
            mainCtx.globalAlpha = 1.0;
          }

          const mainImageUrl = mainCanvas.toDataURL("image/png");

          const previewCanvas = document.createElement("canvas");
          previewCanvas.width = exportW;
          previewCanvas.height = exportH;
          const previewCtx = previewCanvas.getContext("2d");
          previewCtx.putImageData(exportEdit, 0, 0);
          if (exportDoodle) {
            const dc = document.createElement("canvas");
            dc.width = exportW;
            dc.height = exportH;
            const dctx = dc.getContext("2d");
            dctx.putImageData(exportDoodle, 0, 0);
            previewCtx.globalAlpha = doodleAlphaEnabled ? DOODLE_ALPHA : 1.0;
            previewCtx.drawImage(dc, 0, 0);
            previewCtx.globalAlpha = 1.0;
          }
          if (exportMask) {
            const maskCanvas = document.createElement("canvas");
            maskCanvas.width = exportW;
            maskCanvas.height = exportH;
            const maskCtx = maskCanvas.getContext("2d");
            maskCtx.putImageData(exportMask, 0, 0);
            const maskImgData = maskCtx.getImageData(0, 0, exportW, exportH);
            const mask = maskImgData.data;
            const mainImgData = previewCtx.getImageData(0, 0, exportW, exportH);
            const main = mainImgData.data;
            const color = hexToRgb(brushColorInput.value);
            for (let i = 0; i < main.length; i += 4) {
              const alpha = mask[i] / 255;
              if (alpha > 0.01) {
                const blend = alpha * 0.5;
                main[i] = main[i] * (1 - blend) + color.r * blend;
                main[i + 1] = main[i + 1] * (1 - blend) + color.g * blend;
                main[i + 2] = main[i + 2] * (1 - blend) + color.b * blend;
              }
            }
            previewCtx.putImageData(mainImgData, 0, 0);
          }
          const previewImageUrl = previewCanvas.toDataURL("image/png");

          const maskOnlyCanvas = document.createElement("canvas");
          maskOnlyCanvas.width = exportW;
          maskOnlyCanvas.height = exportH;
          const maskOnlyCtx = maskOnlyCanvas.getContext("2d");
          if (exportMask) {
            const maskImgData = new ImageData(
              new Uint8ClampedArray(exportMask.data),
              exportW,
              exportH,
            );
            const maskPixels = maskImgData.data;
            for (let i = 0; i < maskPixels.length; i += 4) {
              const val = maskPixels[i] > 128 ? 255 : 0;
              maskPixels[i] = val;
              maskPixels[i + 1] = val;
              maskPixels[i + 2] = val;
              maskPixels[i + 3] = 255;
            }
            maskOnlyCtx.putImageData(maskImgData, 0, 0);
          } else {
            const blackData = new ImageData(exportW, exportH);
            for (let i = 0; i < blackData.data.length; i++)
              blackData.data[i] = 0;
            maskOnlyCtx.putImageData(blackData, 0, 0);
          }
          const maskOnlyUrl = maskOnlyCanvas.toDataURL("image/png");

          const alphaCanvas = document.createElement("canvas");
          alphaCanvas.width = exportW;
          alphaCanvas.height = exportH;
          const alphaCtx = alphaCanvas.getContext("2d");
          alphaCtx.putImageData(exportEdit, 0, 0);

          if (exportDoodle) {
            const dc = document.createElement("canvas");
            dc.width = exportW;
            dc.height = exportH;
            const dctx = dc.getContext("2d");
            dctx.putImageData(exportDoodle, 0, 0);
            alphaCtx.globalAlpha = doodleAlphaEnabled ? DOODLE_ALPHA : 1.0;
            alphaCtx.drawImage(dc, 0, 0);
            alphaCtx.globalAlpha = 1.0;
          }

          if (exportMask) {
            const maskPixels = exportMask.data;
            const imageData = alphaCtx.getImageData(0, 0, exportW, exportH);
            const pixels = imageData.data;
            for (let i = 0; i < pixels.length; i += 4) {
              pixels[i + 3] = 255 - maskPixels[i];
            }
            alphaCtx.putImageData(imageData, 0, 0);
          }

          const maskAlphaImageUrl = alphaCanvas.toDataURL("image/png");

          return {
            mainImageUrl,
            previewImageUrl,
            maskOnlyUrl,
            maskAlphaImageUrl,
            width: exportW,
            height: exportH,
          };
        }

        window.saveAndClose = function () {
          if (!editImageData) {
            showToast("⚠️ 没有可保存的图片");
            return;
          }

          if (resizeEnabled && resizeEditedAfter) {
            showConfirm(
              "⚠️ 无法保存",
              "请完成全部操作后再执行缩放并保存退出。<br><br>当前已启用导出缩放，且之后又进行了编辑操作。请先撤销或重新确认缩放比例，再保存。",
              null,
              null,
            );
            const overlay = document.querySelector(".custom-confirm-overlay");
            if (overlay) {
              const yesBtn = overlay.querySelector("#confirmYes");
              const noBtn = overlay.querySelector("#confirmNo");
